<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="twitter:creator" content="@smrghsh" />
    <title>sketchbook</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <header id="gallery">
      <button id="prev" class="nav" aria-label="previous sketch">&#x25C0;</button>
      <div id="strip" role="listbox" aria-label="sketches"></div>
      <button id="next" class="nav" aria-label="next sketch">&#x25B6;</button>
    </header>

    <main id="stage">
      <iframe id="viewer" title="sketch" allow="microphone; camera; xr-spatial-tracking; fullscreen"></iframe>
    </main>

    <script src="sketches.js"></script>
    <script src="gallery.js"></script>
  </body>
</html>
