<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to be non-zero -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="twitter:creator" content="@smrghsh" />
    <title>🔮✨🃏🌟💎🪐✦ tarot</title>
    <meta name="description" content="vibecoded tarot deck. no divinity guaranteed." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/standard.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
        }
      }
    </script>

    <style>
      body {
        background: #0a0a0f;
        color: rgba(255, 255, 255, 0.85);
      }
      #params {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* Reading panel (bottom center, slides up on reveal) */
      #reading-panel {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%) translateY(100%);
        z-index: 15;
        width: min(560px, 96vw);
        padding: 28px 32px 32px;
        background: rgba(4, 3, 12, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-bottom: none;
        border-radius: 20px 20px 0 0;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #reading-panel.visible {
        transform: translateX(-50%) translateY(0%);
      }
      .panel-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .card-name {
        font-size: 22px;
        font-weight: 300;
        letter-spacing: 0.08em;
        color: rgba(220, 200, 255, 0.95);
      }
      .card-orientation {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(180, 160, 220, 0.65);
      }
      .card-subtitle {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(180, 150, 255, 0.5);
        margin-bottom: 18px;
      }
      .divider {
        width: 40px;
        height: 1px;
        background: rgba(180, 150, 255, 0.3);
        margin-bottom: 18px;
      }
      .interpretation {
        font-size: 14.5px;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.78);
        font-weight: 300;
      }
    </style>
  </head>
  <body>
    <!-- canvas is appended to <body> by the sketch; it stays beneath
         the corners by document order — no z-index needed on it -->

    <!-- top left: parameters & buttons -->
    <div id="controls">
      <div id="params"></div>
      <button id="draw-btn" class="ctrl">draw a card ✦</button>
      <button id="reset-btn" class="ctrl">reset</button>
      <button id="rotate-btn" class="ctrl">auto rotate</button>
    </div>

    <!-- bottom left: what this is -->
    <div id="bottom-left">
      <div id="description-title">thoth tarot oracle</div>
      <div id="description">vibecoded tarot deck. no divinity guaranteed.</div>
      <div id="hint">draw a card &middot; drag to orbit &middot; scroll to zoom</div>
    </div>

    <!-- bottom right: handles -->
    <div id="attribution">
      <a href="https://github.com/smrghsh" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

      <a href="https://samir.tech" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
          />
        </svg>
        samir.tech
      </a>
    </div>

    <!-- reading panel: card interpretation slides up from bottom center -->
    <div id="reading-panel">
      <div class="panel-header">
        <div class="card-name" id="panel-name">—</div>
        <div class="card-orientation" id="panel-orientation">Upright</div>
      </div>
      <div class="card-subtitle" id="panel-subtitle"></div>
      <div class="divider"></div>
      <div class="interpretation" id="panel-text"></div>
    </div>

    <script src="../../shared/standard.js"></script>
    <script type="module" src="sketch.js"></script>
  </body>
</html>
