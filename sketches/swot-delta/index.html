        <div class="param-label">
          <span>season speed</span><span id="season-value">1.0</span>
        </div>
        <input id="season" type="range" min="0" max="4" step="0.1" value="1" />
      </div>
      <div class="param">
        <div class="param-label">
          <span>displace</span><span id="displace-value">0.080</span>
        </div>
        <input id="displace" type="range" min="0.01" max="0.5" step="0.005" value="0.08" />
      </div>
      <button id="pause" class="ctrl">pause ✦</button>
    </div>

    <div id="bottom-left">
      <div id="description-title">delta breathing</div>
